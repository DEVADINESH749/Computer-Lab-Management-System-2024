{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff login</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
    <center>
    <form name="myform" action="{% url 'stlogin' %}" method="POST" onsubmit="return validateForm()">
        <div class="wrapper">
            <div class="form-box">
                <h2>Staff Login</h2>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" value=""><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" value=""><br><br><br>
                <button type="submit" class="btn">Login</button>
                <div class="login-li">
                    <p>Don't have an account? <a href="{% url 'streg' %}" class="login-link">Staff Register</a></p>
                    {% csrf_token %}
                    {% if messages %}
                    <ul class="messages">
                    {% for message in messages %}
                    <li>{{ message }}</li>
                    {% endfor %}
                    </ul>
                    {% endif %}
                </div>
            </div>
        </div>
    </form>
    </center>
    </body>
    <script src="{% static 'app.js' %}"></script>
</body>
</html>
